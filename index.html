<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stone Faces</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>STONE FACES</h1>
  <p>Minecraft player heads carved out of grey stone blocks. Start with <code>node server.js</code>, then open <code>http://localhost:3000</code>.</p>
</header>

<main>
  <section class="panel">
    <label for="names">Nicknames (loaded from list.txt, editable here)</label>
    <textarea id="names" rows="8" spellcheck="false"></textarea>

    <div class="opts">
      <label>Detail (blocks per side)
        <select id="size">
          <option value="8">8 × 8 (native)</option>
          <option value="16" selected>16 × 16</option>
          <option value="24">24 × 24</option>
          <option value="32">32 × 32</option>
          <option value="48">48 × 48</option>
        </select></label>
      <label>Tone distribution
        <select id="tones">
          <option value="rushmore" selected>Rushmore (few blacks, more mid greys)</option>
          <option value="real">Real luminance</option>
          <option value="rank">Even (one tone per block)</option>
        </select></label>
      <label>Edges / eyes <output id="edgeOut">0.6</output>
        <input id="edge" type="range" min="0" max="1" step="0.05" value="0.6"></label>
      <label>Zone segmentation <output id="segOut">0.6</output>
        <input id="segment" type="range" min="0" max="1" step="0.05" value="0.6"></label>
      <label>Zone count (skin, hair, eyes…)
        <select id="zones">
          <option value="2">2</option><option value="3">3</option>
          <option value="4" selected>4</option><option value="5">5</option><option value="6">6</option>
        </select></label>
      <label>Tone equalization <output id="eqOut">0.5</output>
        <input id="equalize" type="range" min="0" max="1" step="0.05" value="0.5"></label>
      <label>Contrast <output id="conOut">1</output>
        <input id="contrast" type="range" min="0" max="1" step="0.05" value="1"></label>
      <label>Block variation <output id="varOut">0.25</output>
        <input id="variation" type="range" min="0" max="1" step="0.05" value="0.25"></label>
      <label>Seed
        <input id="seed" type="text" value="stone"></label>
      <label>Sheet columns
        <input id="cols" type="number" min="1" max="50" value="4"></label>
      <label class="chk"><input id="dither" type="checkbox"> Dithering (Floyd-Steinberg)</label>
      <label class="chk"><input id="clean" type="checkbox" checked> Clean textures only (no cobblestone, calcite…)</label>
      <label class="chk"><input id="inv" type="checkbox"> Invert (dark = light)</label>
      <label class="chk"><input id="gStone" type="checkbox" checked> Stones</label>
      <label class="chk"><input id="gDark" type="checkbox" checked> Blackstone / deepslate / basalt</label>
      <label class="chk"><input id="gExtra" type="checkbox" checked> Smooth greys (concrete, wool, powder)</label>
      <label class="chk"><input id="autosave" type="checkbox" checked> Save .litematic files to schematics/</label>
      <label class="chk"><input id="onlyChanged" type="checkbox" checked> Only rewrite changed .litematic files</label>
      <label class="chk"><input id="refresh" type="checkbox"> Re-download skins (ignore cache)</label>
    </div>

    <div class="actions">
      <button id="reload">Reload list.txt</button>
      <button id="go">Generate</button>
      <button id="dlPng" disabled>Download PNG</button>
      <button id="dlJson" disabled>Download JSON</button>
    </div>
    <p id="status" class="status"></p>
    <div id="summary" class="summary" hidden></div>
    <div id="ramp" class="ramp" title="Palette sorted by brightness"></div>
  </section>

  <section id="out" class="out"></section>
</main>

<script src="blocks.js"></script>
<script src="app.js"></script>
</body>
</html>
